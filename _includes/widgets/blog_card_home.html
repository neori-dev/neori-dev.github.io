{% assign posts = include.posts %}
<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h6 class="border-bottom border-gray p-3 mb-0">
        <i class="fas fa-rss"></i> Blog
        <a href="{{ 'blog' | relative_url }}">(view all <i class="fas fa-angle-double-right"></i>)</a>
    </h6>
    {% for item in posts limit:include.limit %}
        {% include widgets/blog_card.html item=item hide_bottom_border=forloop.last first=forloop.first last=forloop.last %}
    {% endfor %}
    <h6 class="d-block p-3 mt-0 text-right">
        <a href="{{ 'blog' | relative_url }}">All blog posts <i class="fas fa-angle-double-right"></i></a>
    </h6>
</div>
